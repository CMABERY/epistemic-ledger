[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epistemic-ledger"
version = "0.1.0"
description = "Append-only, content-addressed derivation ledger with an executable verification gate"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "jsonschema==4.25.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
]

[project.scripts]
ledger = "ledger.cli:main"
nre-verify-fixtures = "nre.verify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
