name: Governance Gates

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # ADR-016: append-only diff needs full history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
          python -m pip check
      - name: Unit and contract tests
        run: bash ci/run_tests.sh

  ledger-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # ADR-016: never shallow — merge base must exist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
          python -m pip check
      - name: Append-only + frozen pins + fsck (Regime B — no replay)
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch origin "${{ github.base_ref }}"
            bash ci/run_ledger_gate.sh "origin/${{ github.base_ref }}"
          else
            bash ci/run_ledger_gate.sh
          fi

  nre-fencepost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
          python -m pip check
      - name: Sprint-1 acceptance gate (Frozen)
        run: bash ci/run_verify_fixtures.sh
